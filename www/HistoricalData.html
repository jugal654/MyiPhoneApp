        .close-btn {

            z-index: 1000;
            padding: 0;

        }

    <style>

        .custom-select {
            width: 100%;

            border: 1px solid rgba(227,192,112,.55) !important;
            border-radius: 10px !important;

            letter-spacing: .3px;

            -webkit-appearance: none;
            background-image: linear-gradient(45deg, transparent 50%, #e3c070 50%),

            background-position: calc(100% - 20px) calc(1em + 2px),
                                 calc(100% - 15px) calc(1em + 2px);
            background-size: 5px 5px, 5px 5px;
            background-repeat: no-repeat;
        }
        .custom-select:focus {
            outline: none;
            border-color: #e3c070 !important;
            box-shadow: 0 0 0 3px rgba(227,192,112,.22) !important;
        }
        .custom-select option {
            background: #2b1a11;
            color: #FFFFFF;
            padding: 8px;
        }

        /* =========================================================
           DATE INPUT — force pure WHITE text and picker icon
           (overrides custom-select inherited dark background-image)
           ========================================================= */
        input[type="date"].custom-select,
        input[type="date"]#StartDate {
            background-color: #4a2f22 !important;
            background-image: none !important;       /* remove chevron images */
            color: #FFFFFF !important;
            -webkit-text-fill-color: #FFFFFF !important;  /* iOS / WebKit */
            caret-color: #FFFFFF !important;
            border: 1px solid rgba(227,192,112,.55) !important;
            border-radius: 10px !important;
            padding: 10px 14px !important;
            font-size: 15px !important;
            font-weight: 600 !important;
            letter-spacing: .3px;
            box-shadow: 0 2px 8px rgba(0,0,0,.35) inset !important;
            appearance: none;
            -webkit-appearance: none;
            min-height: 44px;
        }
        input[type="date"].custom-select:focus,
        input[type="date"]#StartDate:focus {
            outline: none;
            border-color: #e3c070 !important;
            box-shadow: 0 0 0 3px rgba(227,192,112,.22) !important;
        }

        /* --- Force every WebKit sub-element of the date field to white --- */
        input[type="date"].custom-select::-webkit-datetime-edit,
        input[type="date"].custom-select::-webkit-datetime-edit-fields-wrapper,
        input[type="date"].custom-select::-webkit-datetime-edit-text,
        input[type="date"].custom-select::-webkit-datetime-edit-month-field,
        input[type="date"].custom-select::-webkit-datetime-edit-day-field,
        input[type="date"].custom-select::-webkit-datetime-edit-year-field,
        input[type="date"]#StartDate::-webkit-datetime-edit,
        input[type="date"]#StartDate::-webkit-datetime-edit-fields-wrapper,
        input[type="date"]#StartDate::-webkit-datetime-edit-text,
        input[type="date"]#StartDate::-webkit-datetime-edit-month-field,
        input[type="date"]#StartDate::-webkit-datetime-edit-day-field,
        input[type="date"]#StartDate::-webkit-datetime-edit-year-field {
            color: #FFFFFF !important;
            -webkit-text-fill-color: #FFFFFF !important;
            background: transparent !important;
            opacity: 1 !important;
        }

        /* --- Calendar picker icon: turn it white --- */
        input[type="date"].custom-select::-webkit-calendar-picker-indicator,
        input[type="date"]#StartDate::-webkit-calendar-picker-indicator {
            filter: brightness(0) invert(1) !important;   /* pure white */
            opacity: .95 !important;
            cursor: pointer;
        }
        input[type="date"].custom-select::-webkit-calendar-picker-indicator:hover,

            filter: brightness(0) invert(1) sepia(1) saturate(3) hue-rotate(340deg) !important; /* golden on hover */

    <!-- close button handler -->
    <script>
        function goBack() {
            try {
                if (document.referrer && document.referrer.indexOf(window.location.origin) === 0) {
                    window.history.back();
                    return;
                }
            } catch (e) {}
            window.location.href = 'index.html';
        }
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape' || e.keyCode === 27) goBack();
        });
        document.addEventListener('deviceready', function () {
            try { document.addEventListener('backbutton', goBack, false); } catch (e) {}
        }, false);
    </script>

    <script>

            btn.style.cssText = `
                position: fixed;
                top: 12px;

                justify-content: center;
                transition: transform 0.2s ease, box-shadow 0.2s ease;
                border: 2px solid rgba(0, 0, 0, 0.20);
                user-select: none;
                -webkit-tap-highlight-color: transparent;
            `;

            btn.addEventListener('mouseenter', function() {
                this.style.transform = 'scale(1.12)';
                this.style.boxShadow = '0 6px 20px rgba(0, 0, 0, 0.40)';
            });
            btn.addEventListener('mouseleave', function() {
                this.style.transform = 'scale(1)';
                this.style.boxShadow = '0 4px 14px rgba(0, 0, 0, 0.30)';
            });
            btn.addEventListener('touchstart', function() {
                this.style.transform = 'scale(0.92)';
            }, { passive: true });
            btn.addEventListener('touchend', function() {
                this.style.transform = 'scale(1)';
            }, { passive: true });

            btn.addEventListener('click', function(e) {
                e.preventDefault();
                window.location.href = 'menu.html';
