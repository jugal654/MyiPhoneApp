<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<meta name="author" content="">
<link rel="icon" href="img/favicon.ico">
<title>TDS Calculator | V S GOLD</title>

<style>
    :root{
        --bg:        #3d251a;
        --card-top:  #4a2e20;
        --card-bot:  #352015;
        --gold:      #e3c070;
        --gold-dark: #b29045;
        --gold-lite: #e8c877;
        --text:      #f3e7d8;
        --muted:     #c3ab93;
        --line:      rgba(227,192,112,.20);
    }

    *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

    html, body{ min-height:100%; }

    body{
        margin:0;
        background-color:#3d251a;
        background-image:radial-gradient(circle at 50% -10%, rgba(227,192,112,.10), transparent 55%);
        background-attachment:fixed;
        color:var(--text);
        font-family:"Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size:15px;
        padding:74px 14px 60px;
        min-height:100vh;
    }

    /* ---------- Close (back) button ---------- */
    .close-btn{
        position:fixed;
        top:16px;
        right:16px;
        width:44px;
        height:44px;
        border-radius:50%;
        border:1px solid rgba(227,192,112,.55);
        background:rgba(0,0,0,.28);
        color:var(--gold);
        font-size:24px;
        line-height:1;
        display:flex;
        align-items:center;
        justify-content:center;
        cursor:pointer;
        z-index:1000;
        padding:0;
        transition:transform .25s ease, background .25s ease, color .25s ease;
        -webkit-backdrop-filter:blur(4px);
        backdrop-filter:blur(4px);
    }
    .close-btn:hover,
    .close-btn:focus{
        background:var(--gold);
        color:#2b1a11;
        transform:rotate(90deg);
        outline:none;
    }
    .close-btn:active{ transform:rotate(90deg) scale(.92); }

    /* ---------- Card ---------- */
    .card{
        max-width:840px;
        margin:0 auto;
        background:linear-gradient(160deg, var(--card-top) 0%, var(--card-bot) 100%);
        border:1px solid rgba(227,192,112,.30);
        border-radius:18px;
        padding:24px 22px 26px;
        box-shadow:0 20px 45px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.05);
    }

    .page-title{
        margin:0 0 4px;
        text-align:center;
        font-size:20px;
        font-weight:700;
        letter-spacing:2px;
        text-transform:uppercase;
        background:linear-gradient(to right,#b29045,#e3c070,#f6e2ad,#e3c070,#b29045);
        -webkit-background-clip:text;
        background-clip:text;
        color:transparent;
    }
    .title-rule{
        width:70px;
        height:2px;
        margin:10px auto 20px;
        background:linear-gradient(to right, transparent, var(--gold), transparent);
        border-radius:2px;
    }

    /* ---------- Tabs ---------- */
    .toggle{
        display:flex;
        gap:6px;
        padding:6px;
        background:rgba(0,0,0,.28);
        border:1px solid var(--line);
        border-radius:14px;
        margin-bottom:20px;
    }
    .tab{
        flex:1;
        border:none;
        background:transparent;
        color:var(--muted);
        font-family:inherit;
        font-size:14px;
        font-weight:600;
        letter-spacing:.4px;
        padding:11px 8px;
        border-radius:9px;
        cursor:pointer;
        transition:all .25s ease;
    }
    .tab:hover{ color:var(--gold); }
    .tab.active{
        background:linear-gradient(to right,#b29045,#e3c070,#e8c877,#e3c070,#b29045);
        color:#2b1a11;
        box-shadow:0 4px 14px rgba(227,192,112,.28);
    }

    /* ---------- Table ---------- */
    .table-scroll{
        overflow-x:auto;
        -webkit-overflow-scrolling:touch;
        border-radius:12px;
        border:1px solid var(--line);
        background:rgba(0,0,0,.16);
    }
    table{
        width:100%;
        border-collapse:collapse;
        table-layout:fixed;
        min-width:430px;
    }
    thead th{
        background:rgba(0,0,0,.38);
        color:var(--gold);
        font-size:11.5px;
        font-weight:700;
        letter-spacing:.8px;
        text-transform:uppercase;
        padding:12px 6px;
        text-align:center;
        border-bottom:1px solid rgba(227,192,112,.35);
        white-space:nowrap;
    }
    tbody td{
        padding:9px 6px;
        text-align:center;
        vertical-align:middle;
        border-bottom:1px solid rgba(227,192,112,.10);
        font-size:15px;
    }
    tbody tr:last-child td{ border-bottom:none; }
    tbody tr{ transition:background .2s ease; }
    tbody tr:hover{ background:rgba(227,192,112,.05); }

    .cell{
        width:100%;
        background:rgba(255,255,255,.06);
        border:1px solid rgba(227,192,112,.28);
        border-radius:9px;
        color:#fff;
        font-family:inherit;
        font-size:15px;
        text-align:center;
        padding:9px 6px;
        outline:none;
        transition:border-color .2s, background .2s, box-shadow .2s;
        -moz-appearance:textfield;
    }
    .cell::placeholder{ color:rgba(243,231,216,.30); }
    .cell:focus{
        border-color:var(--gold);
        background:rgba(227,192,112,.12);
        box-shadow:0 0 0 3px rgba(227,192,112,.12);
    }
    .cell::-webkit-outer-spin-button,
    .cell::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }

    .pct{ color:var(--muted); font-size:14px; font-weight:600; }

    .payable{
        color:var(--gold);
        font-weight:700;
        font-size:15px;
        white-space:nowrap;
    }

    .del{
        width:32px;
        height:32px;
        border-radius:50%;
        border:1px solid rgba(227,192,112,.35);
        background:rgba(0,0,0,.25);
        color:#e8917f;
        display:inline-flex;
        align-items:center;
        justify-content:center;
        cursor:pointer;
        padding:0;
        transition:all .2s ease;
    }
    .del:hover{ background:#c0392b; border-color:#c0392b; color:#fff; }
    .del:active{ transform:scale(.9); }

    /* ---------- Add more ---------- */
    .actions{
        display:flex;
        justify-content:flex-end;
        margin:16px 0 6px;
    }
    .btn-gold{
        background:linear-gradient(to right,#b29045,#e3c070,#e8c877,#e3c070,#b29045);
        color:#2b1a11;
        font-family:inherit;
        font-weight:700;
        font-size:13.5px;
        letter-spacing:.5px;
        border:none;
        border-radius:999px;
        padding:10px 22px;
        cursor:pointer;
        box-shadow:0 6px 16px rgba(227,192,112,.22);
        transition:transform .2s ease, box-shadow .2s ease;
    }
    .btn-gold:hover{
        transform:translateY(-2px);
        box-shadow:0 10px 22px rgba(227,192,112,.38);
    }
    .btn-gold:active{ transform:translateY(0) scale(.98); }

    /* ---------- Summary ---------- */
    .summary{
        margin-top:18px;
        padding:8px 14px;
        border:1px solid var(--line);
        border-radius:14px;
        background:rgba(0,0,0,.20);
    }
    .srow{
        display:flex;
        align-items:baseline;
        gap:10px;
        padding:10px 2px;
        border-bottom:1px dashed rgba(227,192,112,.16);
    }
    .srow:last-child{ border-bottom:none; }
    .slabel{
        flex:1;
        text-align:right;
        color:var(--muted);
        font-size:14px;
    }
    .scolon{ color:var(--gold-dark); font-weight:700; }
    .svalue{
        flex:1;
        text-align:left;
        color:var(--gold);
        font-weight:700;
        font-size:16px;
    }
    .srow.total{
        margin-top:4px;
        padding-top:14px;
        border-top:1px solid rgba(227,192,112,.32);
        border-bottom:none;
    }
    .srow.total .slabel{
        color:var(--text);
        font-weight:700;
        font-size:15px;
        text-transform:uppercase;
        letter-spacing:.6px;
    }
    .srow.total .svalue{
        font-size:20px;
        background:linear-gradient(to right,#b29045,#e3c070,#f6e2ad,#e3c070,#b29045);
        -webkit-background-clip:text;
        background-clip:text;
        color:transparent;
    }

    /* ---------- Toast ---------- */
    .msg{
        position:fixed;
        left:50%;
        bottom:22px;
        transform:translate(-50%,20px);
        background:#5a2b22;
        color:#ffd9cf;
        border:1px solid rgba(255,140,120,.5);
        padding:11px 20px;
        border-radius:999px;
        font-size:13px;
        opacity:0;
        pointer-events:none;
        transition:opacity .3s ease, transform .3s ease;
        z-index:1200;
        max-width:90vw;
        text-align:center;
    }
    .msg.show{ opacity:1; transform:translate(-50%,0); }

    /* ---------- Responsive ---------- */
    @media (max-width:600px){
        body{ padding:68px 10px 50px; font-size:14px; }
        .card{ padding:20px 14px 22px; border-radius:16px; }
        .page-title{ font-size:16px; letter-spacing:1.4px; }
        thead th{ font-size:10px; padding:10px 3px; letter-spacing:.4px; }
        tbody td{ padding:7px 4px; font-size:13px; }
        .cell{ font-size:14px; padding:8px 4px; }
        .payable{ font-size:13.5px; }
        .del{ width:28px; height:28px; }
        .svalue{ font-size:15px; }
        .srow.total .svalue{ font-size:18px; }
        .close-btn{ width:40px; height:40px; font-size:22px; top:12px; right:12px; }
    }

    @media (max-width:380px){
        thead th{ font-size:9px; }
        tbody td{ font-size:12px; padding:6px 3px; }
        .cell{ font-size:13px; padding:7px 3px; }
    }
</style>
</head>

<body>

<!-- ===== Top-right close / back button ===== -->
<button type="button" class="close-btn" aria-label="Close" title="Close" onclick="goBack()">&#10005;</button>

<div class="card">

    <h1 class="page-title">TDS Calculator</h1>
    <div class="title-rule"></div>

    <!-- TDS / TCS switch -->
    <div class="toggle" role="tablist">
        <button type="button" class="tab active" data-mode="TDS" onclick="setMode('TDS')">TDS Calculator</button>
        <button type="button" class="tab"        data-mode="TCS" onclick="setMode('TCS')">TCS Calculator</button>
    </div>

    <!-- Rows -->
    <div class="table-scroll">
        <table>
            <thead>
                <tr>
                    <th style="width:22%">Weight</th>
                    <th style="width:16%" id="pctHead">TDS(%)</th>
                    <th style="width:22%">Rate(&#8377;)</th>
                    <th style="width:25%">Payable</th>
                    <th style="width:15%">Option</th>
                </tr>
            </thead>
            <tbody id="rows"></tbody>
        </table>
    </div>

    <div class="actions">
        <button type="button" class="btn-gold" onclick="addRow()">+ Add More</button>
    </div>

    <!-- Summary -->
    <div class="summary">
        <div class="srow">
            <span class="slabel">Total Weight</span>
            <span class="scolon">:</span>
            <span class="svalue" id="total_weight">0</span>
        </div>
        <div class="srow">
            <span class="slabel">Total Amount</span>
            <span class="scolon">:</span>
            <span class="svalue" id="total_amt">&#8377; 0</span>
        </div>
        <div class="srow">
            <span class="slabel" id="taxLabel">Total TDS</span>
            <span class="scolon">:</span>
            <span class="svalue" id="tax_amt">&#8377; 0</span>
        </div>
        <div class="srow total">
            <span class="slabel">Payable</span>
            <span class="scolon">:</span>
            <span class="svalue" id="pay_amt">&#8377; 0</span>
        </div>
    </div>

</div>

<!-- Toast -->
<div id="msg" class="msg"></div>

<!-- ===== Offline notice (used by online_offline.js) ===== -->
<div id="connectiondiv" class="connectiondiv" style="display:none;">
    <label align="center" id="connectionmsg" class="connectionmsg">Please check your internet connection</label>
    <a id="connectionbtn" onclick="javascript:connectionbtn()" class="retry_connection_btn">Retry</a>
</div>

<!-- ===== App scripts ===== -->
<script src="js/jquery.min.js" type="text/javascript"></script>
<script src="js/custom.js" type="text/javascript"></script>
<script type="text/javascript" src="cordova.js"></script>
<script src="js/Alert.Jugal.js" type="text/javascript"></script>
<script type="text/javascript" src="js/index.js"></script>
<script src="js/online_offline.js" type="text/javascript"></script>

<script type="text/javascript">
/* ============================================================
   TDS / TCS Calculator  —  logic (dependency free)
   ============================================================ */
var mode = 'TDS';
var seq  = 0;

/* Indian number grouping */
function inr(n){
    if (!isFinite(n)) n = 0;
    try { return Math.round(n).toLocaleString('en-IN'); }
    catch(e){ return String(Math.round(n)); }
}

function showMsg(text){
    var m = document.getElementById('msg');
    if (!m) return;
    m.textContent = text;
    m.classList.add('show');
    clearTimeout(m._t);
    m._t = setTimeout(function(){ m.classList.remove('show'); }, 2600);
}

function rowTemplate(id){
    return '' +
      '<td><input type="number" class="cell w" inputmode="decimal" placeholder="0" oninput="calculate()"></td>' +
      '<td class="pct">0.1</td>' +
      '<td><input type="number" class="cell r" inputmode="decimal" placeholder="0" oninput="calculate()"></td>' +
      '<td class="payable">&#8377;0</td>' +
      '<td>' +
        '<button type="button" class="del" aria-label="Delete row" onclick="deleteRow(' + id + ')">' +
          '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" ' +
               'stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
            '<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>' +
          '</svg>' +
        '</button>' +
      '</td>';
}

function makeRow(){
    var tbody = document.getElementById('rows');
    var id = ++seq;
    var tr = document.createElement('tr');
    tr.setAttribute('data-id', id);
    tr.innerHTML = rowTemplate(id);
    tbody.appendChild(tr);
    return tr;
}

function addRow(){
    var tbody = document.getElementById('rows');
    var rows  = tbody.getElementsByTagName('tr');

    /* validate existing rows first (same behaviour as original) */
    for (var i = 0; i < rows.length; i++){
        var w = rows[i].querySelector('.w').value.trim();
        var r = rows[i].querySelector('.r').value.trim();
        if (w === '' || r === ''){
            showMsg('Please enter weight and rate in all rows.');
            return;
        }
    }
    makeRow();
    calculate();
}

function deleteRow(id){
    var tbody = document.getElementById('rows');
    if (tbody.getElementsByTagName('tr').length <= 1){
        showMsg('At least one row is required.');
        return;
    }
    var tr = tbody.querySelector('tr[data-id="' + id + '"]');
    if (tr) tbody.removeChild(tr);
    calculate();
}

function calculate(){
    var rows = document.getElementById('rows').getElementsByTagName('tr');

    var totalWeight  = 0,
        totalAmount  = 0,
        totalTax     = 0,
        totalPayable = 0;

    for (var i = 0; i < rows.length; i++){
        var tr = rows[i];
        var w  = parseFloat(tr.querySelector('.w').value) || 0;
        var r  = parseFloat(tr.querySelector('.r').value) || 0;

        var amount = w * r;

        /* TDS = 0.1% of the value after removing 3% GST  -> amount / 1030
           TCS = 0.1% of the invoice value                -> amount / 1000 */
        var tax = (mode === 'TDS') ? (amount / 1030) : (amount / 1000);
        var pay = (mode === 'TDS') ? (amount - tax)  : (amount + tax);

        tr.querySelector('.payable').innerHTML = '&#8377;' + inr(amount);

        totalWeight  += w;
        totalAmount  += amount;
        totalTax     += tax;
        totalPayable += pay;
    }

    document.getElementById('total_weight').textContent = inr(totalWeight);
    document.getElementById('total_amt').textContent    = '\u20B9 ' + inr(totalAmount);
    document.getElementById('tax_amt').textContent      = '\u20B9 ' + inr(totalTax);
    document.getElementById('pay_amt').textContent      = '\u20B9 ' + inr(totalPayable);
}

function setMode(m){
    mode = m;
    var tabs = document.querySelectorAll('.tab');
    for (var i = 0; i < tabs.length; i++){
        if (tabs[i].getAttribute('data-mode') === m){
            tabs[i].classList.add('active');
        } else {
            tabs[i].classList.remove('active');
        }
    }
    document.getElementById('pctHead').textContent  = m + '(%)';
    document.getElementById('taxLabel').textContent = 'Total ' + m;
    calculate();
}

/* ---------- Back / Close ---------- */
function goBack(){
    try {
        if (document.referrer && document.referrer.indexOf(window.location.origin) === 0){
            window.history.back();
            return;
        }
    } catch (e) { /* ignore */ }
    window.location.href = 'index.html';
}

/* Esc key also closes */
document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' || e.keyCode === 27) goBack();
});

/* ---------- Boot ---------- */
document.addEventListener('DOMContentLoaded', function(){
    makeRow();      /* first row */
    calculate();
});

/* Cordova / device ready */
document.addEventListener('deviceready', function(){
    try { document.addEventListener('backbutton', goBack, false); } catch(e){}
    try { window.ga.trackView('TDS Calculator'); } catch(e){}
}, false);

/* Legacy app bootstrap */
try { if (window.app && typeof app.initialize === 'function') app.initialize(); } catch(e){}
</script>



<script>
    (function() {
        // Create the cross button container
        var btn = document.createElement('div');
        btn.id = 'topRightCrossBtn';
        btn.innerHTML = '&#10005;'; // ✕ symbol

        // Style the button
        btn.style.cssText = `
                position: fixed;
                top: 12px;
                right: 14px;
                z-index: 999999;
                width: 44px;
                height: 44px;
                background: rgba(255, 255, 255, 0.92);
                color: #222;
                font-size: 26px;
                font-weight: 700;
                font-family: Arial, Helvetica, sans-serif;
                line-height: 1;
                text-align: center;
                border-radius: 50%;
                box-shadow: 0 4px 14px rgba(0, 0, 0, 0.30);
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: transform 0.2s ease, box-shadow 0.2s ease;
                border: 2px solid rgba(0, 0, 0, 0.20);
                user-select: none;
                -webkit-tap-highlight-color: transparent;
            `;

        // Hover / tap feedback
        btn.addEventListener('mouseenter', function() {
            this.style.transform = 'scale(1.12)';
            this.style.boxShadow = '0 6px 20px rgba(0, 0, 0, 0.40)';
        });
        btn.addEventListener('mouseleave', function() {
            this.style.transform = 'scale(1)';
            this.style.boxShadow = '0 4px 14px rgba(0, 0, 0, 0.30)';
        });
        btn.addEventListener('touchstart', function() {
            this.style.transform = 'scale(0.92)';
        }, { passive: true });
        btn.addEventListener('touchend', function() {
            this.style.transform = 'scale(1)';
        }, { passive: true });

        // Click → navigate to menu.html
        btn.addEventListener('click', function(e) {
            e.preventDefault();
            window.location.href = 'menu.html';
        });

        // Append to body
        document.body.appendChild(btn);
    })();
</script>
</body>
</html>
