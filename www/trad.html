<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHREE GOLD • Live Trade Logs | Clear Local View</title>
    <script src="js/tailwindcss.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #1a0f0a; margin: 0; display: flex; flex-direction: column; height: 100vh; color: white; overflow: hidden; }
        .gold-gradient { background: linear-gradient(180deg, #3d251a 0%, #23140e 100%); }
        .trade-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05); transition: all 0.2s; backdrop-filter: blur(4px); }
        .status-EXECUTED { color: #10b981; background: rgba(16, 185, 129, 0.15); }
        .status-WAITING { color: #f97316; background: rgba(249, 115, 22, 0.15); }
        .status-CANCELLED { color: #94a3b8; background: rgba(148, 163, 184, 0.15); }
        .tab-active { color: #f59e0b; border-bottom: 2px solid #f59e0b; }
        ::-webkit-scrollbar { display: none; }
        .glass-divider { height: 1px; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent); }
        .gst-exempt-badge {
            background: rgba(245, 158, 11, 0.2);
            color: #fbbf24;
            font-size: 7px;
            font-weight: bold;
            border-radius: 20px;
            padding: 2px 8px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .toast-notify {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: #1f2937;
            backdrop-filter: blur(12px);
            color: white;
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 600;
            z-index: 999;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,215,0,0.3);
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        .toast-notify.show { opacity: 1; }
        .loading-spinner { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; }
        .spinner { width: 32px; height: 32px; border: 3px solid rgba(255,255,255,0.2); border-top-color: #f59e0b; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .reload-link {
            color: #f59e0b;
            text-decoration: underline;
            cursor: pointer;
            font-size: 11px;
            margin-top: 10px;
            display: inline-block;
        }
    </style>
</head>
<body class="max-w-md mx-auto relative shadow-2xl">

    <header class="fixed top-0 w-full max-w-md bg-white pt-6 pb-4 px-6 rounded-b-[30px] shadow-xl z-50 text-gray-800">
        <div><br><br></div>
        <div class="flex justify-between items-center mb-6">
            <button onclick="history.back()" class="w-9 h-9 bg-gray-50 border border-gray-100 rounded-full flex items-center justify-center active:scale-90 transition-transform">
                <i class="fa-solid fa-chevron-left text-[#3d251a] text-xs"></i>
            </button>
            <div class="text-center">
                <h1 class="text-xl font-black tracking-tighter text-[#3d251a] leading-none">TRADE LOGS</h1>
                <p class="text-[8px] tracking-[0.4em] font-bold text-amber-700 uppercase">Local Clear Only | No DB Delete</p>
            </div>
            <button id="clearLocalViewBtn" class="dustbin-btn w-9 h-9 bg-red-50/80 border border-red-200 rounded-full flex items-center justify-center active:scale-90 transition-transform text-red-700 hover:bg-red-100" title="Clear all orders from screen (database unchanged)">
                <i class="fa-solid fa-trash-can text-sm"></i>
            </button>
        </div>
        <div class="flex border-b border-gray-100">
            <div class="flex-1 pb-3 text-[10px] font-bold uppercase tracking-widest tab-active text-center">LIVE LEDGER</div>
        </div>
        <div class="text-[8px] text-amber-600 text-center mt-1 flex items-center justify-center gap-2">
            <i class="fa-regular fa-eye-slash"></i>
            <span>🔹 Dustbin clears your screen only – data stays safe in database</span>
        </div>
    </header>

    <main class="gold-gradient flex-grow pt-44 px-4 pb-24 overflow-y-auto relative">
        <div id="trade-list" class="space-y-3"></div>
        <div id="empty-state" class="flex flex-col items-center justify-center py-20 opacity-30" style="display: none;">
            <i class="fa-solid fa-clock-rotate-left text-6xl mb-4 text-amber-600"></i>
            <p class="font-bold uppercase tracking-widest text-xs text-gray-400">No trade records</p>
            <p class="text-[9px] text-gray-500 mt-2">You cleared the local view</p>
            <a id="reloadDataLink" class="reload-link"><i class="fa-solid fa-rotate-right mr-1"></i> Reload data from database</a>
        </div>
        <div id="loading-state" class="loading-spinner">
            <div class="spinner"></div>
            <p class="text-xs text-amber-400/70 mt-3">Syncing live orders...</p>
        </div>
        <div id="bottom-anchor" class="h-4"></div>
    </main>

    <div id="toastMsg" class="toast-notify">🧹 Local display cleared (data not deleted)</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBIghUCcQUxCcfYJOdCMgPsTuRSgnJpe6E",
            authDomain: "shreegold-120eb.firebaseapp.com",
            projectId: "shreegold-120eb",
            storageBucket: "shreegold-120eb.appspot.com",
            messagingSenderId: "915011378925",
            appId: "1:915011378925:web:c03003bc7eca3ccc0bb6e4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        const container = document.getElementById('trade-list');
        const emptyState = document.getElementById('empty-state');
        const loadingState = document.getElementById('loading-state');
        const clearBtn = document.getElementById('clearLocalViewBtn');
        const toastMsgDiv = document.getElementById('toastMsg');
        const reloadLink = document.getElementById('reloadDataLink');
        
        let currentUnsubscribe = null;
        let isViewCleared = false;
        
        const GST_PERCENT = 3;

        function isSilverProduct(productName) {
            if (!productName) return false;
            const upper = productName.toUpperCase();
            return upper.includes("SILVER") || upper.includes("SLVR") || upper.includes("AG") || upper.includes("SILV");
        }
        
        function isGSTPreApplied(productName) {
            if (!productName) return false;
            const upper = productName.toUpperCase();
            return upper.includes("SL") || upper.includes("GLD") || upper.includes("WITH GST");
        }
        
        function getEffectiveAmount(order) {
            const originalAmount = order.grandTotal || 0;
            const productName = order.product || '';
            const isPreGst = isGSTPreApplied(productName);
            if (isPreGst) {
                const baseAmount = originalAmount / (1 + (GST_PERCENT / 100));
                const gstDeducted = originalAmount - baseAmount;
                return { displayAmount: Math.round(baseAmount), originalAmount: Math.round(originalAmount), gstDeducted: Math.round(gstDeducted), isPreGST: true };
            } else {
                return { displayAmount: Math.round(originalAmount), originalAmount: Math.round(originalAmount), gstDeducted: 0, isPreGST: false };
            }
        }
        
        function calculateRates(order) {
            const effective = getEffectiveAmount(order);
            const displayAmount = effective.displayAmount;
            const qtyGrams = order.quantity || 0;
            const productName = order.product || '';
            const isSilver = isSilverProduct(productName);
            const isPre = effective.isPreGST;
            if (!qtyGrams) return { exclGST: 0, inclGST: 0, isPreGST: isPre, displayAmount, isSilver, unitLabel: isSilver ? "per KG" : "per 10GM" };
            let pricePerGram;
            if (isPre) pricePerGram = displayAmount / qtyGrams;
            else pricePerGram = (displayAmount / (1 + GST_PERCENT/100)) / qtyGrams;
            const inclPricePerGram = displayAmount / qtyGrams;
            const multiplier = isSilver ? 1000 : 10;
            return { exclGST: pricePerGram * multiplier, inclGST: inclPricePerGram * multiplier, isPreGST: isPre, displayAmount, isSilver, unitLabel: isSilver ? "per KG" : "per 10GM" };
        }
        
        function formatINR(v) { return Math.round(v || 0).toLocaleString('en-IN'); }
        function formatRate(v, isSilver) { return `₹${Math.round(v).toLocaleString('en-IN')}`; }
        function formatDateTime(timestamp) {
            if (!timestamp) return "N/A";
            const d = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            return `${d.getDate().toString().padStart(2,'0')}-${(d.getMonth()+1).toString().padStart(2,'0')}-${d.getFullYear().toString().slice(-2)} ${d.getHours()%12||12}:${d.getMinutes().toString().padStart(2,'0')} ${d.getHours()>=12?'PM':'AM'}`;
        }
        
        function showToast(msg, isErr = false) {
            if (!toastMsgDiv) return;
            toastMsgDiv.innerText = msg;
            toastMsgDiv.classList.add('show');
            setTimeout(() => toastMsgDiv.classList.remove('show'), 2200);
        }
        
        function renderOrders(ordersList) {
            if (isViewCleared) return;
            if (!ordersList.length) {
                container.innerHTML = '';
                emptyState.style.display = 'flex';
                loadingState.style.display = 'none';
                return;
            }
            emptyState.style.display = 'none';
            loadingState.style.display = 'none';
            const sorted = [...ordersList].sort((a,b) => (b.createdAt?.toDate?.() || 0) - (a.createdAt?.toDate?.() || 0));
            container.innerHTML = sorted.map(order => {
                let displayStatus = "WAITING", statusClass = "status-WAITING", statusIcon = "fa-regular fa-hourglass-half";
                if (order.status === 'success') { displayStatus = "EXECUTED"; statusClass = "status-EXECUTED"; statusIcon = "fa-solid fa-circle-check"; }
                else if (order.status === 'cancelled') { displayStatus = "CANCELLED"; statusClass = "status-CANCELLED"; statusIcon = "fa-solid fa-ban"; }
                
                const type = (order.type || 'BUY').toUpperCase();
                const typeColor = type === 'BUY' ? 'border-l-green-500' : 'border-l-red-500';
                const timeString = formatDateTime(order.createdAt);
                const product = order.product || 'GOLD';
                const userId = order.user?.phone?.slice(-4) || order.user?.name?.slice(0,6) || 'GUEST';
                const shortId = order.orderId?.slice(-6) || order.id?.slice(-6) || '---';
                const effective = getEffectiveAmount(order);
                const rates = calculateRates(order);
                const isSlGld = isGSTPreApplied(product);
                const finalTotalDisplay = `₹${formatINR(effective.displayAmount)}`;
                const gstAmountDisplay = formatINR(effective.gstDeducted);
                const rateDisplay = formatRate(rates.inclGST, rates.isSilver);
                const unitLabelShort = rates.isSilver ? "KG" : "10GM";
                
                return `
                <div class="trade-card p-4 rounded-2xl relative border-l-4 ${typeColor}">
                    <div class="flex justify-between items-start mb-3">
                        <div class="flex-1">
                            <div class="flex items-center flex-wrap gap-1">
                                <p class="text-[9px] font-black text-amber-500 uppercase tracking-widest"><i class="fa-regular fa-clock mr-1"></i>${timeString}</p>
                                ${isSlGld ? `<span class="gst-exempt-badge"><i class="fa-regular fa-gem"></i> GST locked</span>` : ''}
                            </div>
                            <h3 class="text-sm font-extrabold text-white">${escapeHtml(product)}</h3>
                            <div class="flex gap-2 mt-1"><span class="text-[8px] bg-white/10 px-1.5 py-0.5 rounded text-gray-300"><i class="fa-regular fa-user mr-1"></i>${escapeHtml(userId)}</span><span class="text-[8px] text-gray-500">Ref: ${shortId}</span></div>
                        </div>
                        <div class="text-right">
                            <span class="inline-flex items-center px-2 py-1 rounded-md text-[8px] font-black uppercase ${statusClass}">${displayStatus} <i class="${statusIcon} ml-1.5 text-[9px]"></i></span>
                            <p class="text-[10px] mt-2 font-bold ${type === 'BUY' ? 'text-green-500' : 'text-red-500'}">${type} ORDER</p>
                        </div>
                    </div>
                    <div class="grid grid-cols-3 gap-2 mt-2 text-center">
                        <div><p class="text-[8px] text-gray-500">Qty</p><p class="font-bold text-white text-sm">${order.quantity || 0} ${order.unit || 'GM'}</p></div>
                        <div><p class="text-[8px] text-gray-500">Rate</p><p class="font-bold text-white text-sm">${rateDisplay}<span class="text-[9px] text-gray-400">/${unitLabelShort}</span></p></div>
                        <div><p class="text-[8px] text-gray-500">GST</p><p class="font-bold text-white text-sm">${isSlGld ? '₹0 <span class="text-[9px] text-amber-400">(inclusive)</span>' : `₹${gstAmountDisplay}`}</p></div>
                    </div>
                    <div class="glass-divider my-3"></div>
                    <div class="flex justify-between items-center">
                        <div><p class="text-[8px] text-gray-500">Final total</p><p class="text-base font-bold text-white">${finalTotalDisplay}</p></div>
                        <div class="text-right"><p class="text-[8px] text-gray-500">Phone</p><p class="text-[9px] font-mono text-gray-400">${order.user?.phone || '—'}</p></div>
                    </div>
                    ${displayStatus === 'WAITING' ? `<div class="mt-2 text-[7px] text-orange-400/70"><i class="fa-solid fa-bell"></i> Awaiting acceptance</div>` : ''}
                    ${displayStatus === 'EXECUTED' ? `<div class="mt-2 text-[7px] text-emerald-400/70"><i class="fa-solid fa-stamp"></i> Order confirmed & executed</div>` : ''}
                </div>`;
            }).join('');
        }
        
        function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }
        
        function startLiveListener() {
            if (currentUnsubscribe) currentUnsubscribe();
            const q = query(collection(db, "orders"), orderBy("createdAt", "desc"));
            currentUnsubscribe = onSnapshot(q, (snap) => {
                if (isViewCleared) return;
                const orders = [];
                snap.forEach(d => orders.push({ ...d.data(), id: d.id }));
                renderOrders(orders);
            }, (err) => { 
                console.error(err); 
                loadingState.style.display = 'none'; 
                container.innerHTML = `<div class="text-red-400 text-center p-4">⚠️ Firestore connection error</div>`;
            });
        }
        
        function clearLocalView() {
            if (isViewCleared) return;
            isViewCleared = true;
            if (currentUnsubscribe) {
                currentUnsubscribe();
                currentUnsubscribe = null;
            }
            container.innerHTML = '';
            emptyState.style.display = 'flex';
            loadingState.style.display = 'none';
            showToast("🧹 Local display cleared (data not deleted)");
        }
        
        function reloadData() {
            if (!isViewCleared) return;
            isViewCleared = false;
            emptyState.style.display = 'none';
            loadingState.style.display = 'flex';
            startLiveListener();
        }
        
        clearBtn.addEventListener('click', (e) => {
            e.preventDefault();
            clearLocalView();
        });
        
        reloadLink.addEventListener('click', (e) => {
            e.preventDefault();
            reloadData();
        });
        
        startLiveListener();
    </script>
</body>
</html>
