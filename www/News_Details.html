    <style>
        .close-btn {
            position: fixed;
            top: 16px;
            right: 16px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid rgba(227,192,112,.55);

            font-size: 24px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1000;
            padding: 0;
            transition: transform .25s ease, background .25s ease, color .25s ease;
        }
        .close-btn:hover,
        .close-btn:focus {
            background: #e3c070;
            color: #2b1a11;
            transform: rotate(90deg);
            outline: none;
        }
        .close-btn:active { transform: rotate(90deg) scale(.92); }

        @media (max-width: 600px) {
            .close-btn { width: 40px; height: 40px; font-size: 22px; top: 12px; right: 12px; }
        }
    </style>

    <!-- ===== close button handler (matching GoldTrends/SilverTrends) ===== -->
    <script>
        function goBack() {
            try {
                if (document.referrer && document.referrer.indexOf(window.location.origin) === 0) {
                    window.history.back();
                    return;
                }
            } catch (e) {}
            window.location.href = 'News.html';
        }
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape' || e.keyCode === 27) goBack();
        });
        document.addEventListener('deviceready', function () {
            try { document.addEventListener('backbutton', goBack, false); } catch (e) {}
        }, false);
    </script>

    <script>
        (function() {
            var btn = document.createElement('div');
            btn.id = 'topRightCrossBtn';
            btn.innerHTML = '&#10005;';

            btn.style.cssText = `
                position: fixed;
                top: 12px;
                right: 14px;
                z-index: 999999;
                width: 44px;
                height: 44px;
                background: rgba(255, 255, 255, 0.92);
                color: #222;
                font-size: 26px;
                font-weight: 700;
                font-family: Arial, Helvetica, sans-serif;
                line-height: 1;
                text-align: center;
                border-radius: 50%;
                box-shadow: 0 4px 14px rgba(0, 0, 0, 0.30);
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: transform 0.2s ease, box-shadow 0.2s ease;
                border: 2px solid rgba(0, 0, 0, 0.20);
                user-select: none;
                -webkit-tap-highlight-color: transparent;
            `;

            btn.addEventListener('mouseenter', function() {
                this.style.transform = 'scale(1.12)';
                this.style.boxShadow = '0 6px 20px rgba(0, 0, 0, 0.40)';
            });
            btn.addEventListener('mouseleave', function() {
                this.style.transform = 'scale(1)';
                this.style.boxShadow = '0 4px 14px rgba(0, 0, 0, 0.30)';
            });
            btn.addEventListener('touchstart', function() {
                this.style.transform = 'scale(0.92)';
            }, { passive: true });
            btn.addEventListener('touchend', function() {
                this.style.transform = 'scale(1)';
            }, { passive: true });

            btn.addEventListener('click', function(e) {
                e.preventDefault();
                window.location.href = 'menu.html';
            });

            document.body.appendChild(btn);
        })();
    </script>
