        CIRCLE PROGRESS BAR
        ======================*/
        .progressbar {
            display: inline-block;

            margin: 0 0 25px 0;
            text-align: center;
            padding: 15px 0 20px;
        }
        .circle {
            width: 120px;
            height: 120px;
            margin: 0 auto;
            margin-top: 10px;
            display: inline-block;
            position: relative;
            text-align: center;
        }
        .circle canvas {
            vertical-align: middle;
            border-radius: 50%;
        }
        .circle div {
            position: absolute;
            top: 50%;
            left: 50%;
            margin: -18px 0 0 -58px;
            width: 100%;
            text-align: center;
            line-height: 40px;
            font-size: 22px;
            color: #e3c070;
        }
        .circle strong i {
            font-style: normal;
            font-size: 0.6em;
            font-weight: normal;
        }
        .circle span {
            display: block;
            color: white;
            margin-top: 12px;
        }
    </style>

        <script>
            var tempbottomOfWindow;

            var something = (function () {
                var executed = false;
                return function () {
                    if (!executed) {
                        executed = true;

            function Call_Animation(signal) {

                var emptyFillColor = "transparent";
                var fillColor = "#e3c070";

                if (signal == "Buy") {
                    emptyFillColor = "white";
                    fillColor = "#e3c070";
                }
                else {
                    emptyFillColor = "white";
                    fillColor = "#e3c070";
                }

                function animateElements() {
                    $('.progressbar').each(function () {
                        var elementPos = $(this).offset().top;
                        var topOfWindow = $(window).scrollTop();
                        var bottomOfWindow = $(window).scrollTop() + $(window).height();

                        var percent = $(this).find('.circle').attr('data-percent');
                        var percentage = parseInt(percent, 10) / parseInt(100, 10);
                        var animate = $(this).data('animate');

                        if (elementPos < topOfWindow + $(window).height() - 30 && !animate) {
                            $(this).data('animate', true);
                            $(this).find('.circle').circleProgress({
                                startAngle: -Math.PI / 2,
                                value: percent / 100,
                                size: 120,
                                thickness: 20,
                                emptyFill: emptyFillColor,
                                fill: { color: fillColor }
                            }).on('circle-animation-progress', function (event, progress, stepValue) {
                                $(this).find('div').text((stepValue * 100).toFixed(1) + "%");
                            }).stop();
                        }
                        else if (elementPos > topOfWindow + $(window).height() + 30) {
                            $(this).data('animate', true);
                            $(this).find('.circle').circleProgress({
                                startAngle: -Math.PI / 2,
                                value: percent / 100,
                                size: 120,
                                thickness: 20,
                                emptyFill: emptyFillColor,
                                fill: { color: fillColor }
                            }).on('circle-animation-progress', function (event, progress, stepValue) {
                                $(this).find('div').text((stepValue * 100).toFixed(1) + "%");
                            }).stop();
                        }
                        else if (bottomOfWindow == tempbottomOfWindow) {
                            $(this).data('animate', true);
                            $(this).find('.circle').circleProgress({
                                startAngle: -Math.PI / 2,
                                value: percent / 100,
                                size: 120,
                                thickness: 20,
                                emptyFill: emptyFillColor,
                                fill: { color: fillColor }
                            }).on('circle-animation-progress', function (event, progress, stepValue) {
                                $(this).find('div').text((stepValue * 100).toFixed(1) + "%");
                            }).stop();
                        }
                    });
                }

                animateElements();
                $(window).scroll(animateElements);
            }

            function RunAnimationn(signal) {
                Call_Animation(signal);
            }
        </script>

    <script>
        function goBack() {
            try {
                if (document.referrer && document.referrer.indexOf(window.location.origin) === 0) {
                    window.history.back();
                    return;
                }
            } catch (e) {}
            window.location.href = 'index.html';
        }
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape' || e.keyCode === 27) goBack();
        });
        document.addEventListener('deviceready', function () {
            try { document.addEventListener('backbutton', goBack, false); } catch (e) {}
        }, false);
    </script>
