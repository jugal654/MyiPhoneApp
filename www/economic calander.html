<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#b45309" />
    <meta name="description" content="SHREE GOLD Nashik Bullion - Economic Calendar" />

    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.png" />

    <meta property="og:title" content="SHREE GOLD • Economic Calendar" />
    <meta property="og:description" content="Live economic calendar for bullion traders" />

    <title>SHREE GOLD • Economic Calendar</title>

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
        /* ===== ROOT ===== */
        :root {
            --bg-dark: #140c08;
            --panel-bg: rgba(20, 12, 8, 0.78);
            --panel-border: rgba(184, 134, 11, 0.22);
            --text-main: #ffffff;
            --text-muted: #c8b8a8;
            --accent-gold: #fbb13c;
            --accent-gold-dark: #b8860b;
            --accent-up: #22c55e;
            --accent-down: #ef4444;
            --radius-lg: 24px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --font-mono: 'JetBrains Mono', monospace;
            --font-sans: 'Plus Jakarta Sans', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: var(--font-sans);
            background: radial-gradient(ellipse at 30% 20%, #2d1f14 0%, #140c08 100%);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            position: relative;
            overscroll-behavior: none;
        }

        body::before {
            content: '';
            position: fixed;
            top: -30%;
            left: -30%;
            width: 80%;
            height: 80%;
            background: radial-gradient(circle, rgba(184, 134, 11, 0.08) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* ===== TICKER BAR ===== */
        .ticker-bar {
            background: rgba(20, 12, 8, 0.85);
            border-bottom: 1px solid var(--panel-border);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 6px 0;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .ticker-bar::-webkit-scrollbar {
            display: none;
        }

        .ticker-container {
            display: flex;
            gap: 16px;
            padding: 0 16px;
            min-width: max-content;
            align-items: center;
        }

        .ticker-item {
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            font-size: 0.7rem;
            padding: 4px 10px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 20px;
            border: 1px solid rgba(184, 134, 11, 0.10);
            flex-shrink: 0;
        }

        .ticker-symbol {
            font-weight: 700;
            font-family: var(--font-mono);
            color: #f5d06a;
            font-size: 0.65rem;
        }

        .ticker-price {
            font-family: var(--font-mono);
            font-weight: 600;
            color: #fff;
            font-size: 0.7rem;
        }

        .ticker-change {
            font-size: 0.6rem;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 4px;
            line-height: 1.4;
        }

        .ticker-change.up {
            color: var(--accent-up);
            background: rgba(34, 197, 94, 0.12);
            border: 1px solid rgba(34, 197, 94, 0.25);
        }

        .ticker-change.down {
            color: var(--accent-down);
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.25);
        }

        /* ===== APP LAYOUT ===== */
        .app-layout {
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding: 12px;
            flex: 1;
            max-width: 1800px;
            margin: 0 auto;
            width: 100%;
            position: relative;
            z-index: 1;
            min-height: 0;
            height: 100%;
        }

        /* ===== CALENDAR SECTION ===== */
        .calendar-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 0;
            flex: 1;
        }

        /* Header – persistent, always visible */
        .calendar-main-header {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: var(--radius-lg);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            flex-wrap: wrap;
            gap: 8px;
            flex-shrink: 0;
        }

        .calendar-main-header h1 {
            font-size: 0.9rem;
            font-weight: 800;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0;
        }

        .calendar-main-header h1 i {
            color: var(--accent-gold);
            font-size: 0.85rem;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .live-badge {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.6rem;
            font-weight: 700;
            color: var(--accent-up);
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.3);
            padding: 3px 10px;
            border-radius: 20px;
        }

        .live-dot {
            width: 6px;
            height: 6px;
            background-color: var(--accent-up);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-up);
            flex-shrink: 0;
        }

        .cross-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--panel-border);
            color: var(--text-muted);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            transition: all 0.25s ease;
            text-decoration: none;
            cursor: pointer;
        }

        .cross-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--accent-gold);
            color: #fff;
        }

        .cross-btn:active {
            transform: scale(0.92);
        }

        /* ===== CALENDAR CONTAINER — FILLS AVAILABLE SPACE ===== */
        .calendar-container {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--panel-border);
            border-radius: var(--radius-lg);
            width: 100%;
            overflow: hidden;
            position: relative;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            flex: 1 1 auto;
            min-height: 280px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .calendar-container iframe {
            width: 100%;
            height: 100%;
            min-height: 280px;
            border: none;
            display: block;
            background: rgba(0, 0, 0, 0.2);
            border-radius: var(--radius-lg);
        }

        /* ============================================================
           RESPONSIVE BREAKPOINTS
        ============================================================ */

        @media (min-width: 640px) {
            .app-layout {
                padding: 16px;
                gap: 18px;
            }
            .calendar-container {
                min-height: 380px;
            }
            .calendar-main-header h1 {
                font-size: 1rem;
            }
            .cross-btn {
                width: 36px;
                height: 36px;
                font-size: 1.2rem;
            }
            .ticker-item {
                font-size: 0.75rem;
                padding: 4px 14px;
                gap: 8px;
            }
            .ticker-symbol {
                font-size: 0.7rem;
            }
            .ticker-price {
                font-size: 0.75rem;
            }
            .ticker-change {
                font-size: 0.65rem;
            }
            .live-badge {
                font-size: 0.7rem;
                padding: 4px 12px;
            }
            .live-dot {
                width: 7px;
                height: 7px;
            }
        }

        @media (min-width: 1024px) {
            .app-layout {
                padding: 20px;
                gap: 20px;
            }
            .calendar-container {
                min-height: 480px;
                height: 100%;
            }
            .calendar-main-header {
                padding: 16px 24px;
            }
            .calendar-main-header h1 {
                font-size: 1.15rem;
            }
            .live-badge {
                font-size: 0.75rem;
                padding: 4px 14px;
            }
            .live-dot {
                width: 8px;
                height: 8px;
            }
            .cross-btn {
                width: 40px;
                height: 40px;
                font-size: 1.3rem;
            }
            .ticker-container {
                gap: 28px;
                padding: 0 24px;
            }
            .ticker-item {
                font-size: 0.85rem;
                padding: 6px 18px;
                gap: 10px;
            }
            .ticker-symbol {
                font-size: 0.8rem;
            }
            .ticker-price {
                font-size: 0.85rem;
            }
            .ticker-change {
                font-size: 0.75rem;
                padding: 2px 10px;
            }
        }

        @media (min-width: 1400px) {
            .app-layout {
                padding: 24px;
                gap: 24px;
            }
            .calendar-container {
                min-height: 560px;
            }
        }

        /* ============================================================
           MOBILE FIRST: calendar always visible, fills viewport
        ============================================================ */
        @media (max-width: 600px) {
            .ticker-bar {
                display: none !important;
            }

            .app-layout {
                display: flex !important;
                flex-direction: column !important;
                padding: 0 !important;
                margin: 0 !important;
                max-width: 100% !important;
                width: 100vw !important;
                height: 100dvh !important;
                overflow: hidden !important;
                background: #ffffff;
                gap: 0 !important;
            }

            .calendar-section {
                display: flex !important;
                flex-direction: column !important;
                flex: 1 !important;
                min-height: 0 !important;
                gap: 0 !important;
            }

            .calendar-main-header {
                border-radius: 0 !important;
                border-left: none !important;
                border-right: none !important;
                border-top: none !important;
                padding: 10px 16px !important;
                background: rgba(20, 12, 8, 0.95) !important;
                flex-shrink: 0;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5) !important;
            }

            .calendar-main-header h1 {
                font-size: 0.85rem;
            }

            .live-badge {
                font-size: 0.55rem;
                padding: 2px 8px;
            }

            .live-dot {
                width: 5px;
                height: 5px;
            }

            .cross-btn {
                width: 28px;
                height: 28px;
                font-size: 1rem;
            }

            .calendar-container {
                flex: 1 !important;
                height: 100% !important;
                min-height: 0 !important;
                width: 100% !important;
                border-radius: 0 !important;
                border: none !important;
                box-shadow: none !important;
                background: #ffffff;
                position: relative;
                backdrop-filter: none !important;
                -webkit-backdrop-filter: none !important;
            }

            .calendar-container iframe {
                height: 100% !important;
                width: 100% !important;
                min-height: 0 !important;
                border-radius: 0 !important;
                position: absolute !important;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: #ffffff;
            }
        }

        @media (max-width: 380px) {
            .calendar-main-header {
                padding: 8px 12px !important;
            }
            .calendar-main-header h1 {
                font-size: 0.7rem;
            }
            .live-badge {
                font-size: 0.5rem;
                padding: 2px 6px;
            }
            .cross-btn {
                width: 24px;
                height: 24px;
                font-size: 0.9rem;
            }
        }

        /* Touch device fine-tuning */
        @media (hover: none) and (pointer: coarse) {
            .cross-btn:hover {
                background: rgba(255, 255, 255, 0.08);
                border-color: var(--panel-border);
                color: var(--text-muted);
            }
            .cross-btn:active {
                transform: scale(0.92);
            }
        }
    </style>
</head>
<body>

    <!-- ===== TICKER BAR ===== -->
    <div class="ticker-bar">
        <div class="ticker-container">
            <div class="ticker-item">
                <span class="ticker-symbol"><i class="fa-solid fa-coins" style="font-size:0.6rem;margin-right:2px;"></i> XAU/USD</span>
                <span class="ticker-price" id="tick-xau">$4,061.13</span>
                <span class="ticker-change up">+0.65%</span>
            </div>
            <div class="ticker-item">
                <span class="ticker-symbol"><i class="fa-solid fa-gem" style="font-size:0.6rem;margin-right:2px;"></i> XAG/USD</span>
                <span class="ticker-price" id="tick-xag">$58.26</span>
                <span class="ticker-change up">+1.42%</span>
            </div>
            <div class="ticker-item">
                <span class="ticker-symbol"><i class="fa-solid fa-layer-group" style="font-size:0.6rem;margin-right:2px;"></i> XPT/USD</span>
                <span class="ticker-price" id="tick-xpt">$1,595.50</span>
                <span class="ticker-change up">+0.45%</span>
            </div>
            <div class="ticker-item">
                <span class="ticker-symbol">XPD/USD</span>
                <span class="ticker-price">$1,045.00</span>
                <span class="ticker-change up">+0.20%</span>
            </div>
            <div class="ticker-item">
                <span class="ticker-symbol">GOLD/SILVER</span>
                <span class="ticker-price">69.70</span>
                <span class="ticker-change down">-0.45%</span>
            </div>
        </div>
    </div>

    <!-- ===== APP LAYOUT ===== -->
    <main class="app-layout">

        <!-- ===== CALENDAR SECTION ===== -->
        <section class="calendar-section">

            <!-- Persistent Header -->
            <div class="calendar-main-header">
                <h1><i class="fa-regular fa-calendar-circle-plus"></i> ECONOMIC CALENDAR</h1>
                <div class="header-actions">
                    <span class="live-badge">
                        <span class="live-dot"></span> LIVE
                    </span>
                    <a href="menu.html" class="cross-btn" aria-label="Open menu">
                        <i class="fa-solid fa-times"></i>
                    </a>
                </div>
            </div>

            <!-- Calendar Container -->
            <div class="calendar-container" id="calendar_container_wrapper">
                <iframe
                    src="https://sslecal2.forexprostools.com?columns=exc_actual,exc_forecast,exc_previous&features=datepicker,timezone&countries=37,14,35,4,5&calType=week&timeZone=23&lang=56"
                    loading="lazy"
                    title="Economic Calendar"
                    allowtransparency="true"
                    id="calendarIframe"
                ></iframe>
            </div>
        </section>

    </main>

    <!-- ============================================================
    SCRIPT – ensures full-height iframe on all devices
    ============================================================ -->
    <script>
        (function() {
            'use strict';

            const iframe = document.getElementById('calendarIframe');
            const wrapper = document.getElementById('calendar_container_wrapper');

            function resizeCalendar() {
                if (!iframe || !wrapper) return;
                // On mobile, the iframe uses absolute positioning via CSS.
                // On desktop, flex handles it. We just ensure the iframe fills the wrapper.
                iframe.style.height = '100%';
                iframe.style.width = '100%';
            }

            // Run on load
            window.addEventListener('load', function() {
                setTimeout(resizeCalendar, 100);
            });

            // Run on resize / orientation change
            window.addEventListener('resize', resizeCalendar);
            window.addEventListener('orientationchange', function() {
                setTimeout(resizeCalendar, 300);
            });

            // Also when iframe loads
            iframe.addEventListener('load', function() {
                setTimeout(resizeCalendar, 200);
            });

            // Use ResizeObserver if available
            if (wrapper && window.ResizeObserver) {
                const ro = new ResizeObserver(function() {
                    resizeCalendar();
                });
                ro.observe(wrapper);
            }

            console.log('[SHREE GOLD] Economic Calendar • Terminal-style redesign loaded ✓');
        })();
    </script>

</body>
</html>
