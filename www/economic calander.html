<!DOCTYPE html>
<html lang="en">
<head>

    <title>SHREE GOLD • Economic Calendar</title>

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
        /* ===== ROOT ===== */
        :root {
            --bg-dark: #0f0a07;
            --panel-bg: rgba(20, 12, 8, 0.85);
            --panel-border: rgba(184, 134, 11, 0.22);
            --text-main: #ffffff;
            --text-muted: #c8b8a8;
            --accent-gold: #fbb13c;
            --accent-gold-dark: #b8860b;
            --accent-up: #22c55e;
            --accent-down: #ef4444;
            --radius-lg: 20px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --font-mono: 'JetBrains Mono', monospace;
            --font-sans: 'Plus Jakarta Sans', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
            -webkit-overflow-scrolling: touch;
        }

        body {
            font-family: var(--font-sans);
            background: #ffffff;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            position: relative;
            width: 100%;
            height: 100dvh;
            -webkit-user-select: none;
            user-select: none;
        }

        /* ===== TICKER BAR — iPhone optimized ===== */
        .ticker-bar {
            background: rgba(15, 10, 7, 0.96);
            border-bottom: 1px solid rgba(184, 134, 11, 0.18);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 5px 0;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            flex-shrink: 0;
            padding-top: max(5px, env(safe-area-inset-top));
        }

        .ticker-bar::-webkit-scrollbar {
            display: none;
        }

        .ticker-container {
            display: flex;
            gap: 10px;
            padding: 0 14px;
            min-width: max-content;
            align-items: center;
        }

        .ticker-item {
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
            font-size: 0.6rem;
            padding: 3px 8px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 14px;
            border: 1px solid rgba(184, 134, 11, 0.12);
            flex-shrink: 0;
        }

        .ticker-symbol {
            font-weight: 700;
            font-family: var(--font-mono);
            color: #f5d06a;
            font-size: 0.55rem;
        }

        .ticker-price {
            font-family: var(--font-mono);
            font-weight: 600;
            color: #fff;
            font-size: 0.6rem;
        }

        .ticker-change {
            font-size: 0.5rem;
            font-weight: 700;
            padding: 1px 5px;
            border-radius: 3px;
            line-height: 1.4;
        }

        .ticker-change.up {
            color: var(--accent-up);
            background: rgba(34, 197, 94, 0.12);
            border: 1px solid rgba(34, 197, 94, 0.25);
        }

        .ticker-change.down {
            color: var(--accent-down);
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.25);
        }

        /* ===== APP LAYOUT ===== */
        .app-layout {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            width: 100%;
            position: relative;
            z-index: 1;
            background: #ffffff;
        }

        /* ===== CALENDAR SECTION ===== */
        .calendar-section {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            gap: 0;
        }

        /* Header — iOS style with safe area */
        .calendar-main-header {
            background: rgba(15, 10, 7, 0.94);
            border-bottom: 1px solid rgba(184, 134, 11, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 8px 16px;
            padding-top: max(8px, env(safe-area-inset-top));
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            gap: 8px;
            min-height: 46px;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.4);
        }

        .calendar-main-header h1 {
            font-size: 0.8rem;
            font-weight: 800;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 7px;
            margin: 0;
            line-height: 1.2;
        }

        .calendar-main-header h1 i {
            color: var(--accent-gold);
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .live-badge {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.55rem;
            font-weight: 700;
            color: var(--accent-up);
            background: rgba(34, 197, 94, 0.12);
            border: 1px solid rgba(34, 197, 94, 0.28);
            padding: 2px 8px;
            border-radius: 20px;
            letter-spacing: 0.04em;
        }

        .live-dot {
            width: 5px;
            height: 5px;
            background-color: var(--accent-up);
            border-radius: 50%;
            box-shadow: 0 0 6px var(--accent-up);
            flex-shrink: 0;
            animation: pulse-dot 1.8s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        .cross-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(184, 134, 11, 0.2);
            color: var(--text-muted);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: all 0.2s ease;
            text-decoration: none;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            flex-shrink: 0;
        }

        .cross-btn:active {
            transform: scale(0.9);
            background: rgba(255, 255, 255, 0.16);
            border-color: var(--accent-gold);
            color: #fff;
        }

        /* ===== CALENDAR CONTAINER — full bleed ===== */
        .calendar-container {
            flex: 1;
            min-height: 0;
            width: 100%;
            position: relative;
            background: #ffffff;
            overflow: hidden;
        }

        .calendar-container iframe {
            width: 100%;
            height: 100%;
            min-height: 0;
            border: none;
            display: block;
            background: #ffffff;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        /* ============================================================
           iOS DEVICE SPECIFIC OPTIMIZATIONS
        ============================================================ */

        /* iPhone SE / small screens */
        @media (max-width: 380px) {
            .calendar-main-header {
                padding: 6px 12px;
                padding-top: max(6px, env(safe-area-inset-top));
                min-height: 40px;
            }
            .calendar-main-header h1 {
                font-size: 0.65rem;
                gap: 5px;
            }
            .calendar-main-header h1 i {
                font-size: 0.65rem;
            }
            .live-badge {
                font-size: 0.5rem;
                padding: 1px 6px;
                gap: 3px;
            }
            .live-dot {
                width: 4px;
                height: 4px;
            }
            .cross-btn {
                width: 26px;
                height: 26px;
                font-size: 0.85rem;
            }
            .ticker-item {
                font-size: 0.55rem;
                padding: 2px 7px;
            }
            .ticker-symbol {
                font-size: 0.5rem;
            }
            .ticker-price {
                font-size: 0.55rem;
            }
            .ticker-change {
                font-size: 0.45rem;
                padding: 1px 4px;
            }
        }

        /* iPhone with notch / Dynamic Island — safe area bottom */
        @supports (padding: env(safe-area-inset-bottom)) {
            .calendar-container {
                padding-bottom: env(safe-area-inset-bottom);
            }
            .calendar-container iframe {
                bottom: env(safe-area-inset-bottom);
            }
        }

        /* Landscape mode — reduce header height */
        @media (orientation: landscape) and (max-height: 500px) {
            .calendar-main-header {
                padding: 4px 14px;
                padding-top: max(4px, env(safe-area-inset-top));
                min-height: 34px;
            }
            .calendar-main-header h1 {
                font-size: 0.65rem;
            }
            .calendar-main-header h1 i {
                font-size: 0.65rem;
            }
            .live-badge {
                font-size: 0.5rem;
                padding: 1px 6px;
            }
            .live-dot {
                width: 4px;
                height: 4px;
            }
            .cross-btn {
                width: 24px;
                height: 24px;
                font-size: 0.8rem;
            }
            .ticker-bar {
                padding: 3px 0;
                padding-top: max(3px, env(safe-area-inset-top));
            }
            .ticker-item {
                font-size: 0.55rem;
                padding: 2px 7px;
            }
        }

        /* Larger iPhones (Pro Max, Plus) */
        @media (min-width: 430px) and (max-width: 600px) {
            .calendar-main-header {
                padding: 10px 18px;
                padding-top: max(10px, env(safe-area-inset-top));
                min-height: 50px;
            }
            .calendar-main-header h1 {
                font-size: 0.9rem;
                gap: 8px;
            }
            .calendar-main-header h1 i {
                font-size: 0.9rem;
            }
            .live-badge {
                font-size: 0.6rem;
                padding: 3px 10px;
                gap: 5px;
            }
            .live-dot {
                width: 6px;
                height: 6px;
            }
            .cross-btn {
                width: 34px;
                height: 34px;
                font-size: 1.1rem;
            }
            .ticker-item {
                font-size: 0.65rem;
                padding: 4px 10px;
                gap: 6px;
            }
            .ticker-symbol {
                font-size: 0.6rem;
            }
            .ticker-price {
                font-size: 0.65rem;
            }
            .ticker-change {
                font-size: 0.55rem;
                padding: 1px 6px;
            }
        }

        /* iPad / tablet fallback — still clean, not full desktop */
        @media (min-width: 601px) and (max-width: 1024px) {
            .ticker-bar {
                padding: 6px 0;
            }
            .ticker-item {
                font-size: 0.7rem;
                padding: 4px 12px;
                gap: 6px;
            }
            .ticker-symbol {
                font-size: 0.65rem;
            }
            .ticker-price {
                font-size: 0.7rem;
            }
            .ticker-change {
                font-size: 0.6rem;
                padding: 1px 7px;
            }
            .calendar-main-header {
                padding: 12px 24px;
                min-height: 56px;
            }
            .calendar-main-header h1 {
                font-size: 1rem;
                gap: 10px;
            }
            .calendar-main-header h1 i {
                font-size: 1rem;
            }
            .live-badge {
                font-size: 0.7rem;
                padding: 4px 12px;
                gap: 6px;
            }
            .live-dot {
                width: 7px;
                height: 7px;
            }
            .cross-btn {
                width: 38px;
                height: 38px;
                font-size: 1.2rem;
            }
            .calendar-container {
                max-width: 100%;
                margin: 0 auto;
            }
        }

        /* Desktop fallback — not primary target, but keeps things tidy */
        @media (min-width: 1025px) {
            .ticker-bar {
                padding: 8px 0;
            }
            .ticker-container {
                gap: 22px;
                padding: 0 28px;
            }
            .ticker-item {
                font-size: 0.8rem;
                padding: 5px 16px;
                gap: 8px;
            }
            .ticker-symbol {
                font-size: 0.75rem;
            }
            .ticker-price {
                font-size: 0.8rem;
            }
            .ticker-change {
                font-size: 0.7rem;
                padding: 2px 9px;
            }
            .calendar-main-header {
                padding: 14px 28px;
                min-height: 64px;
                border-radius: 0;
            }
            .calendar-main-header h1 {
                font-size: 1.1rem;
                gap: 12px;
            }
            .calendar-main-header h1 i {
                font-size: 1.1rem;
            }
            .live-badge {
                font-size: 0.75rem;
                padding: 4px 14px;
                gap: 6px;
            }
            .live-dot {
                width: 8px;
                height: 8px;
            }
            .cross-btn {
                width: 40px;
                height: 40px;
                font-size: 1.3rem;
            }
            .calendar-container {
                max-width: 100%;
                margin: 0 auto;
            }
        }

        /* Reduce motion for accessibility */
        @media (prefers-reduced-motion: reduce) {
            .live-dot {
                animation: none;
            }
            .cross-btn {
                transition: none;
            }
        }

        /* Dark mode support for iframe area (if iframe supports it) */
        @media (prefers-color-scheme: dark) {
            body {
                background: #0f0a07;
            }
        }
    </style>
</head>
<body>

    <!-- ===== TICKER BAR ===== -->
    <div class="ticker-bar">
        <div class="ticker-container">

    <!-- ===== APP LAYOUT ===== -->
    <main class="app-layout">

        <!-- ===== CALENDAR SECTION ===== -->
        <section class="calendar-section">

            <!-- Persistent Header — iOS optimized -->
            <div class="calendar-main-header">
                <h1><i class="fa-regular fa-calendar-circle-plus"></i> ECONOMIC CALENDAR</h1>
                <div class="header-actions">
                    <span class="live-badge">
                        <span class="live-dot"></span> LIVE
                    </span>
                    <a href="menu.html" class="cross-btn" aria-label="Open menu">
                        <i class="fa-solid fa-times"></i>
                    </a>
                </div>
            </div>

            <!-- Calendar Container — fills remaining viewport -->
            <div class="calendar-container" id="calendar_container_wrapper">
                <iframe
                    src="https://sslecal2.forexprostools.com?columns=exc_actual,exc_forecast,exc_previous&features=datepicker,timezone&countries=37,14,35,4,5&calType=week&timeZone=23&lang=56"
                    loading="lazy"
                    title="Economic Calendar"
                    allowtransparency="true"
                    id="calendarIframe"
                ></iframe>
            </div>
        </section>

    </main>

    <!-- ============================================================
    SCRIPT – ensures full-height iframe on iOS devices
    ============================================================ -->
    <script>
        (function() {
            'use strict';

            const iframe = document.getElementById('calendarIframe');
            const wrapper = document.getElementById('calendar_container_wrapper');

            function resizeCalendar() {
                if (!iframe || !wrapper) return;
                // Force 100% height/width — CSS absolute positioning handles the rest
                iframe.style.height = '100%';
                iframe.style.width = '100%';
            }

            // Run on load
            window.addEventListener('load', function() {
                setTimeout(resizeCalendar, 100);
                // iOS sometimes needs a second pass after dynamic viewport changes
                setTimeout(resizeCalendar, 500);
            });

            // Run on resize / orientation change
            window.addEventListener('resize', function() {
                resizeCalendar();
                // Extra pass for iOS Safari address bar changes
                setTimeout(resizeCalendar, 150);
            });

            window.addEventListener('orientationchange', function() {
                setTimeout(resizeCalendar, 300);
                setTimeout(resizeCalendar, 700);
            });

            // Also when iframe loads
            iframe.addEventListener('load', function() {
                setTimeout(resizeCalendar, 200);
            });

            // Use ResizeObserver if available (modern iOS supports this)
            if (wrapper && window.ResizeObserver) {
                const ro = new ResizeObserver(function() {
                    resizeCalendar();
                });
                ro.observe(wrapper);
            }

            // iOS viewport height fix: handle visual viewport changes
            if (window.visualViewport) {
                window.visualViewport.addEventListener('resize', function() {
                    resizeCalendar();
                });
            }

            // Prevent rubber-band scrolling on the body
            document.addEventListener('touchmove', function(e) {
                if (e.target === document.body || e.target === document.documentElement) {
                    e.preventDefault();
                }
            }, { passive: false });

            console.log('[SHREE GOLD] Economic Calendar • iOS-optimized redesign loaded ✓');
        })();
    </script>
