    <!-- ===== top-right close button styles ===== -->
    <style>
        .close-btn {
            position: fixed;
            top: 16px;
            right: 16px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid rgba(227,192,112,.55);

            font-size: 24px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1000;
            padding: 0;
            transition: transform .25s ease, background .25s ease, color .25s ease;
        }
        .close-btn:hover,
        .close-btn:focus {
            background: #e3c070;
            color: #2b1a11;
            transform: rotate(90deg);
            outline: none;
        }
        .close-btn:active { transform: rotate(90deg) scale(.92); }

        @media (max-width: 600px) {
            .close-btn { width: 40px; height: 40px; font-size: 22px; top: 12px; right: 12px; }
        }

    <!-- =====================================================================
         FORCE DARK MESSAGE CARD  +  FORCE WHITE TEXT
         - Kills white card backgrounds from legacy .boxx / .timeee / .timee
         - Forces ALL text inside the card to WHITE / CREAM (#FFFFFF)
         ===================================================================== -->
    <style id="force-dark-msg-card">
        /* ---------- Card wrapper ---------- */
        .news-card,
        table.boxx,
        #div1 table,
        #gvData_Newss table,
        #gvData_Newss > table {
            background: #4a2f22 !important;
            background-color: #4a2f22 !important;
            color: #FFFFFF !important;
            border: 1px solid rgba(227, 192, 112, 0.45) !important;
            border-radius: 12px !important;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45) !important;
            overflow: hidden !important;
            width: 96% !important;
            max-width: 720px !important;
            margin: 0 auto 22px auto !important;
            border-collapse: separate !important;
        }

        /* ---------- Date ribbon (top row) ---------- */
        .news-card-date,
        .timeee,
        .timeee td,
        .paddingg,
        table.boxx tr.timeee td,
        #gvData_Newss tr.timeee td {
            background: linear-gradient(to right,
                        #b29045, #e3c070, #e8c877, #e3c070, #b29045) !important;
            background-color: #e3c070 !important;
            color: #2b1a11 !important;          /* keep date text dark on gold */
            font-weight: 700 !important;
            text-align: center !important;
            font-size: 12.5px !important;
            letter-spacing: .5px !important;
            text-transform: uppercase !important;
            padding: 8px 14px !important;
            border: 0 !important;
            border-bottom: 1px solid rgba(0,0,0,.25) !important;
        }

        /* ---------- Message body (bottom row) ---------- */
        .news-card-body,
        .timee,
        .timee td,
        table.boxx tr td.timee,
        #gvData_Newss tr td.timee,
        #gvData_Newss tr td:not(.paddingg) {
            background: #4a2f22 !important;
            background-color: #4a2f22 !important;
            color: #FFFFFF !important;          /* <-- WHITE text */
            font-size: 14.5px !important;
            font-weight: 500 !important;
            line-height: 1.65 !important;
            text-align: center !important;
            padding: 20px 16px !important;
            border: 0 !important;
        }

        /* ---------- FORCE WHITE TEXT on every descendant of the card ---------- */
        .news-card,
        .news-card *,
        table.boxx,
        table.boxx *,
        #gvData_Newss,
        #gvData_Newss *,
        #div1 table,
        #div1 table * {
            color: #FFFFFF !important;
        }

        /* ---------- Kill any white background inside #div1 / #gvData_Newss ---------- */
        #div1 td,
        #div1 tr,
        #div1 table td,
        #div1 table tr,
        #gvData_Newss td,
        #gvData_Newss tr {
            background-color: transparent !important;
        }
        #div1 table,
        #gvData_Newss table,
        table.boxx {
            background-color: #4a2f22 !important;
        }

        /* ---------- Remove leftover inline bg images ---------- */
        .news-card *,
        table.boxx *,
        #gvData_Newss * {
            background-image: none !important;
        }
        /* re-apply the golden ribbon image only on date cells */
        .news-card-date,
        .timeee,
        .timeee td,
        .paddingg {
            background-image: linear-gradient(to right,
                        #b29045, #e3c070, #e8c877, #e3c070, #b29045) !important;
            color: #2b1a11 !important;          /* restore dark gold-bar text */
        }

        /* ---------- Links inside cards ---------- */
        .news-card a,
        table.boxx a,
        #gvData_Newss a {
            color: #e3c070 !important;
            text-decoration: underline !important;
        }
        .news-card a:hover,
        table.boxx a:hover,
        #gvData_Newss a:hover {
            color: #FFFFFF !important;
        }

        /* ---------- Mobile ---------- */
        @media (max-width: 600px) {
            .news-card,
            table.boxx,
            #div1 table,
            #gvData_Newss table {
                width: 92% !important;
                margin-bottom: 18px !important;

            .news-card-body,
            .timee,
            .timee td { font-size: 13.5px !important; padding: 16px 12px !important; }
        }
    </style>

    <script>
        function goBack() {
            try {
                if (document.referrer && document.referrer.indexOf(window.location.origin) === 0) {
                    window.history.back();
                    return;
                }
            } catch (e) {}
            window.location.href = 'index.html';
        }
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape' || e.keyCode === 27) goBack();
        });
        document.addEventListener('deviceready', function () {
            try { document.addEventListener('backbutton', goBack, false); } catch (e) {}
        }, false);
    </script>

    <script>
        (function() {
            var btn = document.createElement('div');
            btn.id = 'topRightCrossBtn';
            btn.innerHTML = '&#10005;';

            btn.style.cssText = `
                position: fixed;
                top: 12px;
                right: 14px;
                z-index: 999999;
                width: 44px;
                height: 44px;
                background: rgba(255, 255, 255, 0.92);
                color: #222;
                font-size: 26px;
                font-weight: 700;
                font-family: Arial, Helvetica, sans-serif;
                line-height: 1;
                text-align: center;
                border-radius: 50%;
                box-shadow: 0 4px 14px rgba(0, 0, 0, 0.30);
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: transform 0.2s ease, box-shadow 0.2s ease;
                border: 2px solid rgba(0, 0, 0, 0.20);
                user-select: none;
                -webkit-tap-highlight-color: transparent;
            `;

            btn.addEventListener('mouseenter', function() {
                this.style.transform = 'scale(1.12)';
                this.style.boxShadow = '0 6px 20px rgba(0, 0, 0, 0.40)';
            });
            btn.addEventListener('mouseleave', function() {
                this.style.transform = 'scale(1)';
                this.style.boxShadow = '0 4px 14px rgba(0, 0, 0, 0.30)';
            });
            btn.addEventListener('touchstart', function() {
                this.style.transform = 'scale(0.92)';
            }, { passive: true });
            btn.addEventListener('touchend', function() {
                this.style.transform = 'scale(1)';
            }, { passive: true });

            btn.addEventListener('click', function(e) {
                e.preventDefault();
                window.location.href = 'menu.html';
            });

            document.body.appendChild(btn);
        })();
