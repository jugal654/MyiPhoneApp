workflows:
  ios-workflow:
    name: iOS Workflow

    integrations:
      app_store_connect: Personal

    environment:
      xcode: latest

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Capacitor sync
        script: |
          npx cap sync ios

      - name: Build IPA
        script: |
          cd ios/App
          xcode-project build-ipa \
            --project App.xcodeproj \
            --scheme App \
            --archive-xcargs "CODE_SIGN_STYLE=Automatic DEVELOPMENT_TEAM='Chaitanya Sonar'"

    artifacts:
      - build/ios/ipa/*.ipa
