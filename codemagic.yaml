workflows:
  ios-workflow:
    name: iOS Workflow

    environment:
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install npm dependencies
        script: |
          npm install

      - name: Sync Capacitor
        script: |
          npx cap sync ios

      - name: Build iOS App
        script: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
          -scheme App \
          -sdk iphoneos \
          -configuration Release \
          build

    artifacts:
      - ios/App/build/**/*.app