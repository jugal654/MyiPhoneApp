workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Capacitor sync
        script: |
          npx cap sync ios

    artifacts:
      - ios/App/build/**/*.ipa