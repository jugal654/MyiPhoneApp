workflows:
  ios-workflow:
    name: iOS Workflow

    integrations:
      app_store_connect: Personal

    environment:
      xcode: latest

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.gotam.myapp

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Capacitor sync
        script: |
          npx cap sync ios

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Build IPA
        script: |
          cd ios/App
          xcode-project build-ipa \
            --project App.xcodeproj \
            --scheme App

    artifacts:
      - ios/App/build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
